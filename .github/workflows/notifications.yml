name: Notifications

# Envoie les notifications de l'appli aux appareils abonnés (Firebase Cloud Messaging) — voir NOTIFICATIONS.md :
#  - toutes les 15 minutes : cours modifiés, annulés ou ajoutés, combats programmés ou terminés,
#    annonces écrites dans l'espace admin de l'appli (vérifiées avec le secret ADMIN_CODE) ;
#  - le samedi à 16 h (heure de Paris) : rappel d'indiquer ses présences pour la semaine.
# Le programme est dans .github/notifications.py. Le secret FCM_COMPTE contient le compte de service Firebase.
# Chaque envoi est ajouté à notifications/historique.json (affiché dans l'espace admin).
on:
  schedule:
    - cron: "*/15 * * * *"      # GitHub ne garantit pas cet horaire (3 à 4 passages par jour constatés)
  repository_dispatch:
    types: [reveil]             # réveil externe toutes les 15 min (voir NOTIFICATIONS.md, « Réveil externe »)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = passage normal ; test = notification de test à tous ; rappel = rappel du samedi tout de suite ; perso = message à une seule personne"
        required: true
        default: "auto"
        type: choice
        options: [auto, test, rappel, perso]
      destinataire:
        description: "perso : prénom et nom (ou identifiant) du membre"
        required: false
        default: ""
      titre:
        description: "perso : titre de la notification"
        required: false
        default: "Amicale des Bagarreurs"
      message:
        description: "perso : texte de la notification"
        required: false
        default: ""

permissions:
  contents: write

concurrency: notifications

jobs:
  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Choisir le mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else echo "mode=auto" >> "$GITHUB_OUTPUT"; fi
      - name: Vérifier le secret
        id: secret
        env:
          FCM_COMPTE: ${{ secrets.FCM_COMPTE }}
        run: |
          if [ -z "$FCM_COMPTE" ]; then echo "::warning::Secret FCM_COMPTE absent : notifications pas encore activées."; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Envoyer
        id: envoi
        if: steps.secret.outputs.ok == '1'
        env:
          PROJET: amicale-des-bagarreurs
          SITE: https://rottweilert.github.io/amicale-des-bagarreurs/
          MODE: ${{ steps.mode.outputs.mode }}
          FCM_COMPTE: ${{ secrets.FCM_COMPTE }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
          DESTINATAIRE: ${{ github.event.inputs.destinataire }}
          TITRE: ${{ github.event.inputs.titre }}
          MESSAGE: ${{ github.event.inputs.message }}
        run: |
          pip install -q google-auth requests
          python3 .github/notifications.py
      - name: Enregistrer l'état et l'historique
        if: steps.envoi.outputs.historique == '1' || steps.envoi.outputs.change == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notifications/
          git diff --cached --quiet && exit 0
          git commit -q -m "Notifications : état et historique"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done; exit 1
