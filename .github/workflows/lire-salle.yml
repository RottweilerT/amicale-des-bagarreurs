name: Lire la salle (temporaire)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, re, urllib.request
          KEY = re.search(r'apiKey:\s*"([^"]+)"', open("index.html", encoding="utf-8").read()).group(1)
          B = "https://firestore.googleapis.com/v1/projects/amicale-des-bagarreurs/databases/(default)/documents/"
          H = {"Referer": "https://rottweilert.github.io/amicale-des-bagarreurs/"}
          def val(v):
              for k in ("stringValue","integerValue","doubleValue","booleanValue"):
                  if k in v: return v[k]
              if "arrayValue" in v: return [val(x) for x in v["arrayValue"].get("values", [])]
              return None
          def lister(c):
              out, t = [], ""
              while True:
                  d = json.load(urllib.request.urlopen(urllib.request.Request(f"{B}{c}?pageSize=300&key={KEY}" + (f"&pageToken={t}" if t else ""), headers=H)))
                  out += d.get("documents", []); t = d.get("nextPageToken")
                  if not t: return out
          for d in lister("courses"):
              f = {k: val(v) for k, v in d.get("fields", {}).items()}
              if str(f.get("kind","")).startswith("salle"): print("SALLE", d["name"].split("/")[-1], json.dumps(f, ensure_ascii=False))
          for d in lister("members"):
              f = d.get("fields", {})
              print("MEMBRE", d["name"].split("/")[-1], val(f.get("first",{})), "off" if val(f.get("off",{})) else "actif")
          PY
